[package]
name = "linthra_core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "High-performance library indexing and search core for Linthra"
publish = false

[lib]
name = "linthra_core"
path = "src/lib.rs"
# rlib for the benchmark and the tests, cdylib for the app: hook/build.dart
# builds the shared library that Dart loads through src/ffi.rs.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "benchmark_200k"
path = "src/bin/benchmark_200k.rs"

[profile.release]
lto = "thin"
codegen-units = 1
# A panic is caught at the C ABI (`guard` in src/ffi.rs) and answered as "no
# answer"; with "abort" a malformed file would end the app instead.
panic = "unwind"

[dependencies]
flutter_rust_bridge = "=2.11.1"
# HTTP for the server clients (docs/development/rust-backend.md, Phase 2).
# TLS is rustls with ring, verified against the platform's own trust store
# (rustls-platform-verifier), never a bundled root list: a server behind a
# private CA the user installed must keep working.
ureq = { version = "=3.5.2", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Pinned exactly: the Android side runs the Kotlin component vendored from
# this very release (android/app/src/main/java/org/rustls/platformverifier/).
rustls-platform-verifier = "=0.7.1"

[target.'cfg(target_os = "android")'.dependencies]
# The JNI handles rustls-platform-verifier needs to reach Android's trust
# manager; the same version it uses.
jni = "0.22"

[lints.rust]
# `cargo fuzz` builds the crate with `--cfg fuzzing`, which turns on the
# entry points in src/tags/mod.rs that the targets in fuzz/ call.
# `frb_expand` is the cfg flutter_rust_bridge's `#[frb]` attribute expands
# to (src/api/subsonic.rs uses `#[frb(sync)]`).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)", "cfg(frb_expand)"] }

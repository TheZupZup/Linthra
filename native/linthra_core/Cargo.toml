[package]
name = "linthra_core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "High-performance library indexing and search core for Linthra"
publish = false

[lib]
name = "linthra_core"
path = "src/lib.rs"
# rlib for the benchmark and the tests, cdylib for the app: hook/build.dart
# builds the shared library that Dart loads through src/ffi.rs.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "benchmark_200k"
path = "src/bin/benchmark_200k.rs"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[dependencies]
flutter_rust_bridge = "=2.11.1"

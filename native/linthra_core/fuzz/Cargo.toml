[package]
name = "linthra_core_fuzz"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

# Fuzz targets for the parsers that read untrusted files: tags and CUE sheets.
# See README.md. Not part of the app build: its own workspace and lockfile.
[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
linthra_core = { path = ".." }

[profile.release]
debug = 1

[[bin]]
name = "tags_flac"
path = "fuzz_targets/tags_flac.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tags_ogg"
path = "fuzz_targets/tags_ogg.rs"
test = false
doc = false
bench = false


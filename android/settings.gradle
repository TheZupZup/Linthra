pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // AGP 9.1.1 is the first release that supports compileSdk/targetSdk 37
    // (Android 17), which Linthra targets. Two documented AGP 9 opt-outs in
    // android/gradle.properties keep this build on the same footing Flutter's
    // own app template uses: android.newDsl=false keeps the legacy variant API
    // that both the Flutter Gradle plugin and the F-Droid per-ABI versionCode
    // hook in app/build.gradle still use, and android.builtInKotlin=false keeps
    // the Kotlin Gradle plugin below applied to the app and to plugins that
    // still apply kotlin-android themselves. Google removes both opt-outs in
    // AGP 10, so moving past AGP 9 means migrating that hook to
    // androidComponents.onVariants (and verifying the F-Droid versionCodes)
    // once Flutter's own plugin no longer needs the legacy API.
    //
    // The Kotlin Gradle plugin is on the 2.4.20+ line because that is the line
    // Kotlin documents as supporting AGP 9.1 together with Gradle 9.3.
    //
    // The two versions on the next lines are updated automatically, one at a
    // time and only within their current major, by
    // .github/workflows/android-toolchain-updates.yml. Keep explanatory prose
    // above this point and out of those lines — the updater is guarded to
    // rewrite the version string and nothing else, comments included.
    id "com.android.application" version "9.1.1" apply false
    id "org.jetbrains.kotlin.android" version "2.4.21" apply false
}

include ":app"

// Media3's FLAC decoder (LibflacAudioRenderer + libflacJNI.so), vendored with
// the libFLAC sources it builds from. It is the fallback for FLAC on devices
// without a platform FLAC decoder (Android only guarantees one from API 27;
// Linthra supports API 24, #674). See third_party/media3_decoder_flac/PATCHES.md.
include ":media3_decoder_flac"
project(":media3_decoder_flac").projectDir = file("../third_party/media3_decoder_flac")

name: GitHub Sponsor Simulation Check

# Builds both simulated states only inside the ephemeral GitHub-hosted runner.
# No APK is uploaded as an artifact or attached to a Release.
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  validate-simulation:
    name: Validate simulated ${{ matrix.state }} state
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        state:
          - locked
          - unlocked

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Retry a download, because the two matrix rows resolve the same Gradle
      # artifacts and install the same NDK on two runners at the same moment,
      # and one of them gets throttled or handed a broken file.
      #
      # That is not hypothetical: in run 35480575826 the `unlocked` row started
      # resolving 8 seconds before `locked` and Maven Central answered it with
      # "Received status code 403 from server: Forbidden" for
      # kotlin-gradle-plugins-bom, 32 seconds in, before a line was compiled.
      # `locked` resolved the same artifacts on the other runner and built, as
      # did `Build debug APK` on that same commit, and every other run of this
      # workflow that day passed. The PR was Dart and Markdown only.
      #
      # The NDK does the same: in run 39161436812 the `unlocked` row got an NDK
      # archive sdkmanager could not open ("An error occurred while preparing
      # SDK package NDK (Side by side) 28.2.13676358: Error on ZipFile unknown
      # archive"), while `locked` installed the same NDK and built, as did
      # `Build debug APK` on that same commit. That PR was Dart and Markdown
      # only too.
      #
      # Deliberately narrow, so this stays a retry and does not become a way to
      # pass a broken build on the second try. Flutter prints "Gradle threw an
      # error while downloading artifacts from the network." for the first
      # class of failure and sdkmanager prints "An error occurred while
      # preparing SDK package" for the second, and nothing else does, so a
      # compile error still fails on the first attempt, at its own speed, with
      # its own message.
      #
      # Gradle's own `org.gradle.internal.repository.max.retries` would not
      # help here: it retries 5xx and transport errors, and a throttle answered
      # as 403 is a client error it treats as final.
      - name: Build simulated GitHub Sponsor state
        run: |
          set -uo pipefail
          artifact_marker='Gradle threw an error while downloading artifacts from the network'
          sdk_marker='An error occurred while preparing SDK package'
          log="$(mktemp)"
          for attempt in 1 2 3; do
            if flutter build apk --debug \
                 --dart-define=LINTHRA_DISTRIBUTION=github \
                 --dart-define=LINTHRA_GITHUB_SPONSOR_SIMULATION=${{ matrix.state }} \
                 2>&1 | tee "$log"; then
              exit 0
            fi
            if ! grep -qF -e "$artifact_marker" -e "$sdk_marker" "$log"; then
              echo "::error::Build failed for a reason other than a download; not retrying."
              exit 1
            fi
            echo "::warning::Download failed on attempt $attempt."
            sleep "$((attempt * 15))"
          done
          echo "::error::Download still failing after 3 attempts."
          exit 1

      - name: Verify APK and remove it
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-debug.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::Expected debug APK not found at $apk."
            exit 1
          fi
          rm -f "$apk"
          test ! -f "$apk"

name: Flatpak build

# Build the real Flatpak whenever packaging-relevant inputs change. This job is
# intentionally independent from the native Linux workflow: it uses the
# Flatpak SDK/runtime declared by the generated manifest and proves that a
# clean GitHub-hosted runner can resolve the declared prerequisites, build the
# package, install it, and reach a real desktop window without developer state.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/flatpak-build.yml'
      - '.flutter-version'
      - 'flatpak/**'
      - 'linux/CMakeLists.txt'
      - 'linux/packaging/**'
      - 'linux/runner/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'scripts/check_linux_runner.py'
      - 'scripts/flatpak_audio_smoke.sh'
      - 'scripts/flatpak_launch_smoke.sh'
      - 'scripts/flatpak_local_library_smoke.sh'
      - 'scripts/make_flatpak_smoke_manifest.py'
      - 'scripts/regenerate_flatpak_sources.sh'
      - 'test/tooling/check_linux_runner_test.py'
      - 'third_party/**'
      - 'tool/branding/linthra_icon.svg'
      - 'tool/linux_audio_backend_smoke.dart'
      - 'tool/linux_local_library_smoke.dart'
      # What the two smokes actually import. Named individually rather than as
      # 'lib/**': the sandbox job is a full flatpak-builder run, and every
      # unrelated UI change would pay for it. A change here can break only
      # inside the sandbox, which is the regression these jobs exist to catch.
      - 'lib/core/services/linux_playback_controller.dart'
      - 'lib/core/services/just_audio_playback_controller.dart'
      - 'lib/core/services/linux_audio_output_device_service.dart'
      - 'lib/core/services/local_playable_uri_resolver.dart'
      - 'lib/core/services/local_artwork_cache.dart'
      - 'lib/core/sources/local/**'
      - 'test/core/sources/local/audio_tag_fixtures.dart'
  pull_request:
    paths:
      - '.github/workflows/flatpak-build.yml'
      - '.flutter-version'
      - 'flatpak/**'
      - 'linux/CMakeLists.txt'
      - 'linux/packaging/**'
      - 'linux/runner/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'scripts/check_linux_runner.py'
      - 'scripts/flatpak_audio_smoke.sh'
      - 'scripts/flatpak_launch_smoke.sh'
      - 'scripts/flatpak_local_library_smoke.sh'
      - 'scripts/make_flatpak_smoke_manifest.py'
      - 'scripts/regenerate_flatpak_sources.sh'
      - 'test/tooling/check_linux_runner_test.py'
      - 'third_party/**'
      - 'tool/branding/linthra_icon.svg'
      - 'tool/linux_audio_backend_smoke.dart'
      - 'tool/linux_local_library_smoke.dart'
      # What the two smokes actually import. Named individually rather than as
      # 'lib/**': the sandbox job is a full flatpak-builder run, and every
      # unrelated UI change would pay for it. A change here can break only
      # inside the sandbox, which is the regression these jobs exist to catch.
      - 'lib/core/services/linux_playback_controller.dart'
      - 'lib/core/services/just_audio_playback_controller.dart'
      - 'lib/core/services/linux_audio_output_device_service.dart'
      - 'lib/core/services/local_playable_uri_resolver.dart'
      - 'lib/core/services/local_artwork_cache.dart'
      - 'lib/core/sources/local/**'
      - 'test/core/sources/local/audio_tag_fixtures.dart'
  workflow_dispatch:

# Fork PRs run this workflow too, so keep it read-only and secret-free.
permissions:
  contents: read

concurrency:
  group: flatpak-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-flatpak:
    name: Build and launch Flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # --no-install-recommends is deliberate: it keeps the runner close to the
      # set of tools this job actually needs, rather than whatever a package
      # happens to suggest. The cost is that every tool has to be named here,
      # including ones a dependency would otherwise have pulled in.
      #
      # Two of these are here because of that, and both failed the same way:
      # silently absent, then a build error nowhere near the real cause.
      #
      # elfutils: flatpak-builder only *recommends* it, so the runner had no
      # `eu-strip`, which flatpak-builder needs to split debug symbols out of
      # every module it builds. The build died on the first native module with
      #   Error: module libplacebo: Failed to execute child process "eu-strip"
      # long before the Linthra module was reached. Installing the package is
      # the fix rather than passing --disable-debuginfo, which would silently
      # change what the exported repository contains.
      #
      # librsvg2-common: nothing in `appstream`/`appstream-compose` depends on
      # or recommends it, and it is what gives gdk-pixbuf its SVG loader.
      # Without it, the `appstreamcli compose` that flatpak-builder runs at
      # finish time cannot read Linthra's scalable icon, drops the component,
      # and fails the whole build with
      #   io.github.thezupzup.linthra  E: file-read-error
      #   general                      E: filters-but-no-output
      # whose hint report names the icon and "Unrecognized image file format".
      - name: Install host validation and smoke tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream \
            dbus-x11 \
            desktop-file-utils \
            elfutils \
            flatpak \
            flatpak-builder \
            librsvg2-common \
            x11-utils \
            xvfb

      - name: Validate committed packaging metadata
        run: |
          set -euo pipefail
          python3 scripts/check_linux_runner.py
          python3 test/tooling/check_linux_runner_test.py

          desktop_report="$(desktop-file-validate linux/packaging/io.github.thezupzup.linthra.desktop)"
          if [ -n "$desktop_report" ]; then
            printf '%s\n' "$desktop_report" >&2
            exit 1
          fi

          appstreamcli validate \
            linux/packaging/io.github.thezupzup.linthra.metainfo.xml

      - name: Add Flathub build remote
        run: |
          set -euo pipefail
          flatpak remote-add --user --if-not-exists \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install manifest-declared SDK and runtime prerequisites
        working-directory: flatpak
        run: |
          set -euo pipefail
          flatpak-builder \
            --user \
            --install-deps-from=flathub \
            --install-deps-only \
            --force-clean \
            flatpak-builder-ci \
            io.github.thezupzup.linthra.yml

      # Fetch the manifest's declared sources before the build, with retries,
      # because one bad response from a source host fails the whole run.
      #
      # That is not hypothetical: run 34173146020 on main died on libplacebo
      # with "Wrong sha256 checksum ... was 150e307c..." after
      # code.videolan.org answered with 3857 bytes — an error page, not the
      # 10 MB tarball. The manifest was fine; it had built on the previous 40+
      # runs and on the feature branch 14 minutes earlier.
      #
      # flatpak-builder only moves a download into its cache once the checksum
      # verifies, so a bad response is never cached and a retry really does
      # re-fetch. This never fails the job: an attempt that keeps failing is a
      # warning and the build step below downloads what is missing and reports
      # the real error, exactly as it does today. It is a retry, not a new gate.
      - name: Prefetch manifest sources
        working-directory: flatpak
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if flatpak-builder \
                 --user \
                 --download-only \
                 --force-clean \
                 flatpak-builder-prefetch \
                 io.github.thezupzup.linthra.yml; then
              echo "Sources downloaded on attempt $attempt."
              exit 0
            fi
            echo "::warning::Source download attempt $attempt failed."
            sleep "$((attempt * 15))"
          done
          echo "::warning::Prefetch did not complete; the build step downloads the rest."

      # Do not restore a module cache here. The CI contract is that the checked
      # in manifest and its declared sources are sufficient on a clean runner.
      # The prefetch above only retries downloads within this same run on this
      # same clean runner, so it changes nothing about that contract.
      # --disable-rofiles-fuse avoids depending on FUSE support in the hosted
      # runner while preserving flatpak-builder's normal sandbox/build model.
      - name: Build Flatpak
        working-directory: flatpak
        run: |
          set -euo pipefail
          rm -rf -- flatpak-builder-ci flatpak-builder-prefetch repo-ci
          flatpak-builder \
            --user \
            --force-clean \
            --disable-cache \
            --disable-rofiles-fuse \
            --repo=repo-ci \
            flatpak-builder-ci \
            io.github.thezupzup.linthra.yml

      - name: Verify exported Flatpak repository
        working-directory: flatpak
        run: |
          set -euo pipefail
          test -d repo-ci/objects
          test -f repo-ci/config
          flatpak build-update-repo repo-ci
          echo 'Flatpak build and repository export completed successfully.'

      - name: Install and launch packaged Flatpak
        working-directory: flatpak
        run: bash ../scripts/flatpak_launch_smoke.sh repo-ci

  # A second build, on its own runner, because the sandbox smokes need binaries
  # the shipped package must not contain (#446, #447). Nobody wants a test
  # harness in a published Flathub app, so the submission manifest stays free of
  # one and this job builds a manifest derived from it instead:
  # scripts/make_flatpak_smoke_manifest.py appends the smoke builds to the app
  # module and then proves that nothing else changed, so the package installed
  # here is the package the job above built plus /app/libexec.
  #
  # Both smokes share this one build. A second derived manifest would mean a
  # second 90-minute flatpak-builder run against a package differing by a
  # directory.
  #
  # It runs in parallel rather than after, so the wall clock is unchanged, and
  # it deliberately repeats the sibling job's setup rather than sharing it: the
  # reasoning behind each of those steps is written out once, above, and the
  # two jobs are supposed to be able to diverge (this one needs PyYAML, that
  # one needs the metadata validators).
  sandbox-smokes:
    name: Sandbox smokes on the packaged app
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # python3-yaml rather than pip: the generator round-trips the manifest,
      # and the distro package is the one already on the runner's python3.
      - name: Install host build and smoke tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus-x11 \
            elfutils \
            flatpak \
            flatpak-builder \
            librsvg2-common \
            python3-yaml \
            xvfb

      - name: Derive the sandbox-smoke manifest from the submission manifest
        run: python3 scripts/make_flatpak_smoke_manifest.py

      - name: Add Flathub build remote
        run: |
          set -euo pipefail
          flatpak remote-add --user --if-not-exists \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install manifest-declared SDK and runtime prerequisites
        working-directory: flatpak
        run: |
          set -euo pipefail
          flatpak-builder \
            --user \
            --install-deps-from=flathub \
            --install-deps-only \
            --force-clean \
            flatpak-builder-sandbox-smoke \
            io.github.thezupzup.linthra.sandbox-smoke.yml

      - name: Prefetch manifest sources
        working-directory: flatpak
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if flatpak-builder \
                 --user \
                 --download-only \
                 --force-clean \
                 flatpak-builder-sandbox-prefetch \
                 io.github.thezupzup.linthra.sandbox-smoke.yml; then
              echo "Sources downloaded on attempt $attempt."
              exit 0
            fi
            echo "::warning::Source download attempt $attempt failed."
            sleep "$((attempt * 15))"
          done
          echo "::warning::Prefetch did not complete; the build step downloads the rest."

      - name: Build Flatpak with the sandbox smokes
        working-directory: flatpak
        run: |
          set -euo pipefail
          rm -rf -- flatpak-builder-sandbox-smoke flatpak-builder-sandbox-prefetch repo-sandbox-smoke
          flatpak-builder \
            --user \
            --force-clean \
            --disable-cache \
            --disable-rofiles-fuse \
            --repo=repo-sandbox-smoke \
            flatpak-builder-sandbox-smoke \
            io.github.thezupzup.linthra.sandbox-smoke.yml
          flatpak build-update-repo repo-sandbox-smoke

      - name: Run the audio lifecycle smoke inside the installed Flatpak
        working-directory: flatpak
        run: bash ../scripts/flatpak_audio_smoke.sh repo-sandbox-smoke

      # Separate step, same package. Each harness installs the app, does its
      # work and uninstalls it again (including the app data) so neither can
      # be reading state the other left behind, and a failure names which of
      # the two sandbox questions went wrong.
      - name: Run the local-library sandbox smoke inside the installed Flatpak
        working-directory: flatpak
        run: bash ../scripts/flatpak_local_library_smoke.sh repo-sandbox-smoke

name: Large-library SQL and memory

on:
  pull_request:
    paths:
      - 'tools/large_library/**'
      - 'test/tooling/large_library_benchmark_test.py'
      - 'test/tooling/large_library_memory_report_test.py'
      - '.github/workflows/large-library-sql.yml'
  push:
    branches: [main]
    paths:
      - 'tools/large_library/**'
      - 'test/tooling/large_library_benchmark_test.py'
      - 'test/tooling/large_library_memory_report_test.py'
      - '.github/workflows/large-library-sql.yml'

permissions:
  contents: read

jobs:
  sqlite-200k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Cheap and offline, so it runs before the 200k fixture is built: if the
      # summary block is broken there is no point spending minutes on timings.
      - name: Test benchmark summary rendering
        run: python3 test/tooling/large_library_benchmark_test.py

      # The judgement half of the memory check (#463). Pure Python over
      # synthetic series: no Flutter, no measurement, nothing machine-dependent,
      # so it belongs in CI even though the measurement itself does not.
      #
      # What it guards is the analyser's ability to tell a leak from noise. The
      # measurement runs locally (tools/large_library/run_memory_check.sh),
      # because an RSS series taken on a shared CI runner says more about the
      # runner than about Linthra. Local twin: the same command.
      - name: Test the memory-report analyser
        run: python3 test/tooling/large_library_memory_report_test.py

      - name: Generate 200k-track catalog
        run: >-
          python3 tools/large_library/generate_sqlite_fixture.py
          --output /tmp/linthra-200k.sqlite
          --tracks 200000

      - name: Benchmark indexed queries
        run: >-
          python3 tools/large_library/benchmark_sqlite.py
          --database /tmp/linthra-200k.sqlite
          --iterations 200
          --max-average-ms 50

# flatpak-flutter.yml — input template for flatpak-flutter.py.
#
# This is NOT the manifest flatpak-builder consumes. It is the hand-authored
# source that `flatpak-flutter.py` (https://github.com/TheAppgineer/flatpak-flutter,
# the tool referenced by Flutter's own deployment docs and by
# flatpak/flatpak-builder-tools) reads to produce the real, offline-buildable
# manifest: `io.github.thezupzup.linthra.yml`, alongside a generated
# `generated/sources/pubspec.json` pinning every package in the committed
# `pubspec.lock`, and a generated Flutter SDK module pinning the exact engine
# artifacts for the `.flutter-version` tag.
#
# Regenerate the output after bumping `.flutter-version` or any pub.dev
# dependency:
#
#   ./scripts/regenerate_flatpak_sources.sh
#
# See flatpak/README.md.
app-id: io.github.thezupzup.linthra
runtime: org.gnome.Platform
runtime-version: '51'
# Bumped from '50' for #449: Flathub's linter fails a submission manifest while
# a newer runtime exists, and that one finding was failing the Flatpak job on
# every open pull request and on main.
#
# The comments further down still say org.gnome.Platform//50 and
# org.gnome.Sdk//50, and that is deliberate rather than an oversight. Each of
# them records something checked *inside* that SDK: no C/C++ compiler of the
# kind Flutter invokes, libsecret 0.21.7 built with libgcrypt, gnutls.pc at
# 3.8.13, alsa.pc and libpulse.pc present, libpipewire's dev files present.
# None has been re-checked inside 51, and rewriting the version in them would
# claim a verification nobody did. They need a pass inside the 51 SDK; until
# then they are accurate about 50 and silent about 51.
#
# The first signal either way is this manifest's own build: if the llvm20
# extension below, or the ffmpeg/libplacebo/libass/mpv modules, or the
# pkg-config files they expect moved in 51, the Flatpak job says so.
sdk: org.gnome.Sdk
# org.gnome.Sdk//50 (built on freedesktop-sdk 25.08) has no C/C++ compiler of
# its own kind Flutter's Linux tool invokes: `flutter build linux` hardcodes
# CC=clang/CXX=clang++, and linux/CMakeLists.txt's -Werror exception for
# flutter_secure_storage_linux is scoped to Clang specifically. This is the
# same LLVM version flatpak-flutter's own generated template defaults to for
# freedesktop-sdk 25.08.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
# linux/CMakeLists.txt: BINARY_NAME "linthra" — check_linux_runner.py asserts
# this matches pubspec.yaml's `name:`.
command: linthra

finish-args:
  # Windowing: Wayland is the default on Fedora Atomic/Kinoite/Silverblue;
  # X11 fallback covers everything else. Neither is optional for a GTK window.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU acceleration for Flutter's GTK/Skia embedder. Without it Linthra still
  # renders, just on software rendering; --device=dri is the minimal grant
  # that lets it use the real GPU.
  - --device=dri
  # Audio output (#433). LinuxPlaybackController's libmpv now actually opens
  # an audio device (ao=auto, built with -Dpulse=enabled below) instead of
  # only being dlopened/registered at startup as it was for #432. On the
  # current org.gnome.Platform//50 / freedesktop-sdk 25.08 runtime this is
  # still the correct, minimal grant for audio: PipeWire's default desktop
  # deployment ships pipewire-pulse, a PulseAudio-protocol-compatible server,
  # so --socket=pulseaudio is what reaches both a native PulseAudio session
  # and a PipeWire one — there is no separate "--socket=pipewire" finish-arg.
  - --socket=pulseaudio
  # User-configured Jellyfin, Navidrome/Subsonic and Plex servers are ordinary
  # HTTP(S) destinations. Flatpak disables all networking unless this single
  # capability is granted; --share=network enables normal sockets (including
  # LAN addresses, DNS hostnames and remote/tunnel endpoints) without exposing
  # host files or adding a D-Bus permission. Provider discovery remains out of
  # scope: direct configured endpoints need no discovery-specific grant.
  - --share=network
  #
  # MPRIS (#397). The Linux media session is a D-Bus object Linthra exports and
  # a well-known name it owns, so a desktop shell can find and drive it. Inside
  # the sandbox that name has to be granted: Flatpak lets an app own names under
  # its own application id, and `org.mpris.MediaPlayer2.linthra` is not one of
  # those.
  #
  # These two grants are the narrowest form that works. --own-name is not
  # --talk-name: owning a name lets other clients call Linthra, and gives
  # Linthra no way to call anything. Both are scoped to Linthra's own player
  # names, so no other player's MPRIS interface becomes reachable — which
  # --socket=session-bus, or an `org.mpris.MediaPlayer2.*` wildcard, would both
  # do. The second line covers the spec's `.instance<pid>` fallback, used when a
  # second Linthra window finds the plain name already taken.
  - --own-name=org.mpris.MediaPlayer2.linthra
  - --own-name=org.mpris.MediaPlayer2.linthra.*
  #
  # Secure credential storage (#441) needs nothing here either, for the same
  # reason local music folders don't: the sandbox path is a portal.
  # flutter_secure_storage's Linux implementation
  # (flutter_secure_storage_linux 1.2.3) is a thin wrapper over libsecret,
  # which chooses its own backend at runtime (secret-backend.c,
  # backend_get_impl_type): when /.flatpak-info exists and xdg-desktop-portal
  # answers org.freedesktop.portal.Secret v1, it uses its file backend, an
  # encrypted store under the app's own data dir whose master secret is handed
  # over by the portal (and held by the host's keyring). Every Flatpak may talk
  # to the portal, so no finish-arg grants it.
  #
  # That portal is exported only when the desktop ships an
  # org.freedesktop.impl.portal.Secret backend (xdg-desktop-portal
  # desktop-portal/secret.c, init_secret: no impl configured means the
  # interface is never exported). Both desktops this targets do:
  #   * GNOME, via gnome-keyring (daemon/dbus/gkd-secret-portal.c).
  #   * KDE Plasma 6, via KWallet's ksecretd
  #     (src/runtime/ksecretd/kwalletportalsecrets.cpp, which installs
  #     org.freedesktop.impl.portal.desktop.kwallet.service and
  #     kwallet.portal). KF6 only; the KF5 kwalletd had no portal backend.
  # org.gnome.Platform//50 carries libsecret 0.21.7 built with libgcrypt
  # (freedesktop-sdk 25.08 elements/components/libsecret.bst), so that file
  # backend is compiled in and the sandbox detection above is live.
  #
  # So --talk-name=org.freedesktop.secrets is deliberately NOT granted. On a
  # host with no Secret portal backend (a KF5-era KDE, a bare WM running only
  # a Secret Service daemon) libsecret falls back to the Secret Service bus
  # name, the sandbox's D-Bus proxy hides it, and Linthra reports a
  # recoverable storage error and stays signed out rather than falling back to
  # any storage of its own. A user who wants that fallback can grant it
  # themselves with `flatpak override --user`; it is not worth a permission on
  # every install (docs/flatpak-development.md "Secure credential storage").
  #
  # Local music folders (#438) need nothing here on purpose. Linthra's Linux
  # runner opens GTK's GtkFileChooserNative, which GTK routes to the
  # xdg-desktop-portal FileChooser inside a sandbox — every app may talk to the
  # portal, so no finish-arg grants it. The folder the user picks comes back
  # through the document portal (already mounted for every Flatpak) as a path
  # under the app's own document store, which is readable *because* the user
  # chose it and stays readable across restarts. Nothing else on the host
  # becomes visible, which is exactly what a --filesystem grant could not
  # promise.
  #
  # Deliberately withheld for issue #432, still withheld here (see
  # flatpak/README.md "What's deferred" for the reasoning):
  #   --filesystem=host/home     (broad filesystem access. Not needed for the
  #                                local library, per the portal note above;
  #                                the remaining permission audit is #439.)
  #   --socket=session-bus, --talk-name=org.freedesktop.secrets, and every
  #                                wildcard or --own-name form of it (#441
  #                                is served by the Secret portal instead,
  #                                per the note above).
  # Their absence is safe: secure storage that is missing, locked or denied
  # surfaces as a recoverable sign-in/storage error and Jellyfin/Subsonic/Plex
  # stay signed out. Linthra never writes a credential to storage of its own,
  # in plaintext or otherwise (docs/linux-desktop.md "Secure storage").

modules:
  # === Self-contained libmpv audio runtime, built from pinned upstream source
  #
  # media_kit/just_audio_media_kit dlopen libmpv.so/.so.1/.so.2 synchronously
  # during Linthra's startup bootstrap — before the first frame — and nothing
  # in the call path catches a failed dlopen (see linux_playback_controller.dart
  # and media_kit's native_library.dart). A GNOME/freedesktop runtime does not
  # ship libmpv, so this module exists in the first place because #432 could
  # not reach a usable first frame without it. #433 turns that bootstrap
  # libmpv into a real playback engine: mpv's own meson.build hard-requires
  # libavcodec/libavfilter/libavformat/libavutil/libswresample/libswscale
  # (ffmpeg), libplacebo and libass unconditionally — there is no smaller mpv
  # — so this stays one module chain, just configured for real audio output
  # and remote streaming instead of the #432 bootstrap minimum.
  #
  # ffmpeg is built from source, not via org.freedesktop.Platform.ffmpeg-full:
  # mpv links against libavcodec/libavformat/etc. at compile time via
  # pkg-config, and ffmpeg-full/codecs-extra is a *runtime* extension (mounted
  # into /app only after the build), so it cannot satisfy a build-time
  # pkg-config dependency() check. This is also what the official
  # io.mpv.Mpv Flathub manifest does. LGPL only (no --enable-gpl/--enable-nonfree):
  # Linthra is audio-only, so no video codec/hwaccel libraries are enabled —
  # only the container/codec support current main actually needs (see
  # lib/core/sources/local/audio_file_types.dart's `supportedExtensions`:
  # mp3, flac, m4a, aac, ogg, opus, wav) plus network protocols for remote
  # HTTP(S) playback (#433's other requirement). Every one of those seven
  # formats decodes with an ffmpeg *native* decoder (mp3float/aac/flac/
  # vorbis/opus/pcm_*/alac) — none needs an external codec library
  # (libmp3lame/libvorbis/libopus are encoder-side only) — so no additional
  # codec module was added; the #432 chain already carried full decode
  # coverage for Linthra's supported formats, it just couldn't reach the
  # network to fetch remote bytes.
  #
  # --enable-network (replacing #432's --disable-network) turns on ffmpeg's
  # http/https/tcp/tls protocol layer, which mpv's stream_lavf.c uses
  # directly for any http(s):// URL — the same path both local files and
  # resolved Jellyfin/Navidrome-Subsonic/Plex stream URLs already go through
  # (see docs/linux-desktop.md "Audio playback"). --enable-gnutls adds the
  # TLS backend https:// needs: GnuTLS is LGPLv2.1+, so it keeps this LGPL-only
  # build's licensing unchanged, and org.gnome.Sdk//50 already ships gnutls.pc
  # (verified: `pkg-config --modversion gnutls` inside the SDK resolves to
  # 3.8.13), so no new module/source is declared for it — it links against
  # the runtime's own gnutls the same way mpv already links the runtime's
  # alsa/pulse below. Flatpak's sandbox also always exposes the host's CA
  # trust store at /etc/ssl/certs regardless of filesystem permissions, so
  # certificate verification needs no extra grant either. OpenSSL is present
  # in the same runtime too (verified) but gnutls was chosen as the
  # traditionally-LGPL-compatible, commonly-used choice for an LGPL ffmpeg
  # build and to sidestep OpenSSL's historical GPL-linking caveats entirely,
  # even though modern OpenSSL (3.x, Apache-2.0) would also be acceptable.
  - name: ffmpeg
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/ffmpeg
    config-opts:
      - --disable-static
      - --enable-shared
      - --disable-doc
      - --disable-programs
      - --enable-network
      - --enable-gnutls
    sources:
      - type: archive
        url: https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n9.0.1.tar.gz
        sha256: 195d54bebe1a27f84d77f4b989d193466f305b355da92292766a69f16880b18a

  # libplacebo: a hard mpv dependency (meson.build's `dependencies = [libass,
  # ..., libplacebo, ...]` has no feature toggle), even though Linthra never
  # renders video — mpv 0.41's GPU-rendering path is not optional. Vulkan is
  # required: libplacebo's own meson.build errors out at configure time if
  # compiled without Vulkan support. jinja/markupsafe/glad are libplacebo git
  # submodules the plain source archive does not include (they show up as
  # empty directories); libplacebo's meson.build imports them directly off
  # disk (no PyPI/pip, no network) so they're declared here as ordinary pinned
  # sources extracted into the same paths the submodules would occupy.
  - name: libplacebo
    buildsystem: meson
    config-opts:
      # Pin the install layout. flatpak-builder passes meson only --prefix=/app,
      # and meson then resolves its *own* default libdir, which is `lib64`
      # inside this SDK because the freedesktop base image carries a real
      # /usr/lib64 directory. That puts libplacebo.so and libplacebo.pc in
      # /app/lib64, which is on neither of the two paths that matter:
      # flatpak-builder's PKG_CONFIG_PATH (so the mpv module below fails its
      # `Dependency "libplacebo" not found` check) nor the sandbox's runtime
      # library path. The autotools modules here already land in /app/lib
      # because flatpak-builder passes them --libdir=/app/lib; this pins the
      # meson ones to the same place, which is also what flatpak/README.md
      # documents ("installed under /app/lib").
      - -Dlibdir=lib
      - -Dvulkan=enabled
      - -Dshaderc=disabled
      - -Dglslang=disabled
      - -Ddemos=false
      - -Dtests=false
    sources:
      - type: archive
        url: https://code.videolan.org/videolan/libplacebo/-/archive/v7.360.1/libplacebo-v7.360.1.tar.gz
        sha256: 14c0a99f4b01557ec9826ce6b1d52f6de21be274ba03fd5aab7307f18766dc39
      - type: archive
        url: https://github.com/pallets/jinja/archive/refs/tags/3.1.6.tar.gz
        sha256: 2074b22a72caa65474902234b320d73463d6d4c223ee49f4b433495758356337
        dest: 3rdparty/jinja
      - type: archive
        url: https://github.com/pallets/markupsafe/archive/refs/tags/3.0.3.tar.gz
        sha256: f1d9d06c34515dd3ad210ec769da613057b536d11d6c039183b87757a883a254
        dest: 3rdparty/markupsafe
      - type: archive
        url: https://github.com/Dav1dde/glad/archive/refs/tags/v2.0.8.tar.gz
        sha256: 44f06f9195427c7017f5028d0894f57eb216b0a8f7c4eda7ce883732aeb2d0fc
        dest: 3rdparty/glad

  # libass: also a hard mpv dependency (subtitle rendering support compiled
  # into libmpv's core regardless of whether Linthra ever feeds it subtitles).
  - name: libass
    config-opts:
      - --disable-static
      - --enable-fontconfig
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://github.com/libass/libass/archive/refs/tags/0.17.5.tar.gz
        sha256: fa286fc9ee1ba3b932703a3df7b8474d01dc8abe29ec69b6fa68781dc4bf7acc

  - name: mpv
    buildsystem: meson
    config-opts:
      # Same meson libdir pin as libplacebo above, and it matters more here:
      # media_kit/just_audio_media_kit dlopen this libmpv by soname at startup,
      # so it has to sit on the sandbox's library path rather than in
      # /app/lib64.
      - -Dlibdir=lib
      # Only libmpv is needed; the mpv CLI player pulls in scripting, disc
      # and gamepad stacks Linthra never touches.
      - -Dcplayer=false
      - -Dlibmpv=true
      - -Dgpl=false
      - -Dbuild-date=false
      - -Dmanpage-build=disabled
      - -Dhtml-build=disabled
      - -Dpdf-build=disabled
      - -Dtests=false
      - -Dcdda=disabled
      - -Ddvdnav=disabled
      - -Ddvbin=disabled
      - -Dlibbluray=disabled
      - -Dlibarchive=disabled
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dvapoursynth=disabled
      - -Dcplugins=disabled
      - -Drubberband=disabled
      # Both audio outputs were already declared in #432 in anticipation of
      # this issue. They now do real work: mpv's ao=auto picks pulse, which
      # is also the protocol pipewire-pulse (the default PipeWire
      # compatibility server on modern desktops) speaks — the same target
      # --socket=pulseaudio opens up above. alsa=enabled stays as the
      # non-PipeWire/non-Pulse fallback (org.gnome.Sdk//50 ships both
      # alsa.pc and libpulse.pc — verified). No new mpv build option is
      # needed for network streaming: mpv has no separate "network" toggle
      # of its own — it opens http(s):// URLs straight through ffmpeg's
      # protocol layer, which is where --enable-network/--enable-gnutls
      # above actually live.
      - -Dalsa=enabled
      - -Dpulse=enabled
      # mpv's own `pipewire` audio-output option defaults to meson's `auto`
      # (unlike every other feature here, which #432 already pinned
      # explicitly), and org.gnome.Sdk//50 happens to carry libpipewire's
      # dev files — so leaving it on `auto` would silently build a *second*,
      # undeclared audio backend the committed finish-args don't grant a
      # socket for (a native PipeWire client needs its own IPC socket;
      # --socket=pulseaudio only exposes the PulseAudio-protocol/
      # pipewire-pulse endpoint pulse=enabled above already targets — see
      # flatpak-flutter.yml's finish-args comment). Disabling it explicitly
      # keeps this module's actual audio-output surface matching exactly
      # what's declared and granted, rather than depending on what a future
      # SDK bump happens to ship.
      - -Dpipewire=disabled
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209

  # === linthra: the app itself ===============================================
  - name: linthra
    buildsystem: simple
    build-options:
      # Rewritten by flatpak-flutter to /var/lib/flutter/bin, where the
      # generated Flutter SDK module installs the activated toolchain.
      append-path: /usr/lib/sdk/llvm20/bin:flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
    build-commands:
      - flutter pub get --enforce-lockfile
      - flutter build linux --release --no-pub
      # Install the whole relocatable bundle (binary + lib/ + data/) under
      # /app/lib/linthra, then symlink the binary into /app/bin.
      # linux/CMakeLists.txt sets CMAKE_INSTALL_RPATH to "$ORIGIN/lib", and
      # $ORIGIN follows the real file location through a symlink, so this
      # keeps the bundle's own relative layout intact instead of splitting it
      # across /app/bin and /app/lib.
      - install -d /app/lib/linthra
      - cp -r build/linux/x64/release/bundle/. /app/lib/linthra/
      - install -d /app/bin
      - ln -s ../lib/linthra/linthra /app/bin/linthra
      # Desktop entry (#434). Installed from the app's own source tree (the
      # `dir` source below stages the whole checkout into this module's build
      # directory), so the file that a native package would install is the one
      # the Flatpak installs — there is no packaging-only copy to drift.
      #
      # /app/share/applications is where flatpak-builder looks at `finish`
      # time: it exports every desktop file it finds there, rewriting `Exec=`
      # into the `flatpak run io.github.thezupzup.linthra` form the host
      # launcher needs, and it only exports files whose name starts with the
      # app id — this one *is* the app id, so no `rename-desktop-file`. `Icon=`
      # names the icon installed immediately below.
      - install -Dm644 linux/packaging/io.github.thezupzup.linthra.desktop /app/share/applications/io.github.thezupzup.linthra.desktop
      # Application icon (#436), installed from Linthra's canonical vector
      # source — `tool/branding/linthra_icon.svg`, the same design
      # `tool/branding/generate_icons.py` rasterises into the Android launcher
      # mipmaps and the store graphics. It is copied, not redrawn: nothing here
      # may fork the brand mark, and installing the source directly means there
      # is no packaging-only duplicate to drift, exactly like the desktop entry
      # above.
      #
      # `hicolor` is the fallback theme every icon theme inherits from,
      # `scalable/apps` is where an app's own resolution-independent icon
      # belongs, and the basename *is* the icon-theme name the entry's `Icon=`
      # looks up. scripts/check_linux_runner.py asserts these paths, this
      # basename and `Icon=` agree, in both manifests.
      #
      # flatpak-builder exports `/app/share/icons/hicolor/**` whose basename
      # starts with the app id at `finish` time, the same rule as the desktop
      # entry — so this needs no `rename-icon` either.
      - install -Dm644 tool/branding/linthra_icon.svg /app/share/icons/hicolor/scalable/apps/io.github.thezupzup.linthra.svg
      # The raster half of the same icon (#436). A launcher resolves the SVG
      # above at whatever size it likes, but the *window* icon cannot: GTK
      # builds X11's `_NET_WM_ICON` by asking gdk-pixbuf to decode what the
      # icon theme hands it, and gdk-pixbuf has no SVG loader of its own —
      # librsvg's pixbuf module is obsolete and its replacement (glycin) is not
      # wired into GTK 3's icon-theme path in org.gnome.Platform. With only a
      # scalable icon installed the lookup produces nothing, GTK sets no icon
      # list at all, and the window ships with no `_NET_WM_ICON` for panels,
      # task switchers and window lists to read — which is exactly what
      # scripts/flatpak_launch_smoke.sh caught. PNG is decoded by a loader built
      # into gdk-pixbuf itself, so these always resolve, and GTK prefers an
      # exact fixed-size match over a scalable one, so nothing else changes.
      #
      # Rasterised from the same source design by tool/branding/generate_icons.py
      # (`python3 tool/branding/generate_icons.py`), like the Android launcher
      # mipmaps — still no second brand mark, just a second encoding of the one.
      - install -Dm644 linux/packaging/icons/hicolor/48x48/apps/io.github.thezupzup.linthra.png /app/share/icons/hicolor/48x48/apps/io.github.thezupzup.linthra.png
      - install -Dm644 linux/packaging/icons/hicolor/64x64/apps/io.github.thezupzup.linthra.png /app/share/icons/hicolor/64x64/apps/io.github.thezupzup.linthra.png
      - install -Dm644 linux/packaging/icons/hicolor/128x128/apps/io.github.thezupzup.linthra.png /app/share/icons/hicolor/128x128/apps/io.github.thezupzup.linthra.png
      - install -Dm644 linux/packaging/icons/hicolor/256x256/apps/io.github.thezupzup.linthra.png /app/share/icons/hicolor/256x256/apps/io.github.thezupzup.linthra.png
      # AppStream metainfo (#435). Software centres and later Flathub read
      # `/app/share/metainfo/<app-id>.metainfo.xml`; flatpak-builder exports
      # that directory at `finish` time under the same app-id-prefix rule as
      # the desktop entry and the icon, so there is no `rename-appdata-file`.
      # The file lives in linux/packaging/ next to the desktop entry so a
      # native package installs the same listing. Claims inside it are limited
      # to what Linux actually ships; scripts/check_linux_runner.py holds the
      # component id, launchable and stock icon to the same sources of truth
      # as the desktop entry.
      - install -Dm644 linux/packaging/io.github.thezupzup.linthra.metainfo.xml /app/share/metainfo/io.github.thezupzup.linthra.metainfo.xml
    sources:
      # The app's own source. flatpak-flutter's pre-processing step cannot
      # read a `dir` source (it only fetches `git` sources to inspect
      # pubspec.lock — see flatpak/README.md), so generating
      # generated/sources/pubspec.json requires a one-time staged directory;
      # the committed *output* manifest keeps this `dir` source, which
      # flatpak-builder itself handles natively at real build time.
      - type: dir
        path: ..
      # Flutter SDK, pinned to the project's .flutter-version. flatpak-flutter
      # replaces this git source with a generated module (see flatpak/README.md)
      # that pins the matching Dart SDK and Linux engine artifacts by their
      # real storage.googleapis.com URLs and sha256, so nothing is fetched
      # ad hoc during the sandboxed build.
      - type: git
        url: https://github.com/flutter/flutter.git
        tag: '3.44.7'
        dest: flutter
